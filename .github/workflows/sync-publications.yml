name: Sync publications

on:
  schedule:
    # Checked every day at 06:00 KST, but the sync itself runs only when the last
    # successful one is 14+ days old. Google Scholar often blocks cloud IPs, so a
    # blocked run simply retries the next day instead of waiting another two weeks.
    - cron: "0 21 * * *"
  workflow_dispatch:        # "Run workflow" button on GitHub: always syncs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skip if synced in the last 14 days
        id: gate
        if: github.event_name == 'schedule'
        run: |
          last=$(grep -oP '"updated": "\K[0-9-]+' assets/js/publications.js || echo 1970-01-01)
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Last successful sync: $last ($age days ago)"
          if [ "$age" -lt 14 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Pull Google Scholar, OpenAlex, KIPRIS
        if: steps.gate.outputs.skip != 'true'
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/sync_publications.py
      - name: Commit if anything changed
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "publication-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/publications.js tools/cache
          git diff --cached --quiet || git commit -m "Sync publications"
          git push
