name: Sync publications

on:
  schedule:
    - cron: "0 21 * * *"   # every day 06:00 KST (Google Scholar often blocks cloud IPs, so retry daily)
  workflow_dispatch:        # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull Google Scholar, OpenAlex, KIPRIS
        env:
          KIPRIS_API_KEY: ${{ secrets.KIPRIS_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python tools/sync_publications.py
      - name: Commit if anything changed
        run: |
          git config user.name "publication-sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/publications.js tools/cache
          git diff --cached --quiet || git commit -m "Sync publications"
          git push
